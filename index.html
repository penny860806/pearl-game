<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>老師的手搖飲不能不加珍珠！</title>
    <style>
      * {
        box-sizing: border-box
      }

      body {
        margin: 0;
        background: #f7ecdd;
        color: #493025;
        font: 16px/1.6 system-ui, -apple-system, "Microsoft JhengHei", sans-serif
      }

      main {
        max-width: 760px;
        margin: auto;
        padding: 30px 20px 24px
      }

      header {
        text-align: center;
        margin-bottom: 20px
      }

      .kicker {
        font-size: 12px;
        letter-spacing: 3px;
        font-weight: 800;
        color: #88664b
      }

      h1 {
        font-size: clamp(26px, 5vw, 43px);
        line-height: 1.25;
        margin: 10px 0
      }

      p {
        margin: 8px 0
      }

      .game {
        background: #fffaf1;
        border: 1px solid #dec5a8;
        border-radius: 24px;
        padding: clamp(12px, 3vw, 24px);
        box-shadow: 0 8px 0 #dcc3a5
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 12px
      }

      .stat {
        background: #f0e1ce;
        border-radius: 12px;
        padding: 8px;
        text-align: center
      }

      .stat small {
        display: block;
        font-size: 12px;
        color: #795b43
      }

      .stat strong {
        font-size: clamp(18px, 4vw, 27px);
        font-variant-numeric: tabular-nums
      }

      canvas {
        width: 100%;
        display: block;
        background: #fbefd9;
        border: 1px solid #dec5a8;
        border-radius: 14px;
        touch-action: none
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        gap: 10px;
        margin-top: 12px
      }

      button {
        font: inherit;
        font-weight: 750;
        border: 0;
        border-radius: 12px;
        padding: 12px 8px;
        background: #e9d6bb;
        color: #493025;
        cursor: pointer;
        touch-action: none
      }

      button#start {
        background: #70472f;
        color: #fffaf1
      }

      button:focus-visible {
        outline: 3px solid #a06a40;
        outline-offset: 3px
      }

      button:active {
        transform: translateY(2px)
      }

      #message {
        text-align: center;
        min-height: 28px;
        font-weight: 700;
        margin: 12px 0 0
      }

      .rules {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
        margin: 24px 0 6px
      }

      .rules span {
        background: #fffaf1;
        border: 1px solid #dec5a8;
        border-radius: 30px;
        padding: 6px 12px
      }

      .hint,
      footer {
        text-align: center;
        color: #795b43;
        font-size: 13px
      }

      footer {
        margin-top: 24px
      }

      .pearl {
        display: inline-block;
        width: 13px;
        height: 13px;
        background: #493025;
        border-radius: 50%;
        vertical-align: middle;
        margin-right: 5px
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="kicker">TFG · VIBE CODING · MINI GAME 01</div>
        <h1>🧋 老師的手搖飲不能不加。珍。珠 🧋 </h1>
        <p>沒有珍珠的手搖飲，怎麼可以呢？</p>
        <p>被稀釋的手搖飲，也是不行的呢！</p>
      </header>
      <section class="game" aria-label="珍珠接接樂">
        <div class="stats">
          <div class="stat">
            <small>分數</small>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <small>剩餘時間</small>
            <strong id="time">30 秒</strong>
          </div>
          <div class="stat">
            <small>生命值</small>
            <strong id="lives">♥♥♥</strong>
          </div>
        </div>
        <canvas id="game" width="420" height="265" aria-label="手搖飲珍珠接取遊戲"></canvas>
        <p id="message" aria-live="polite">接住黑糖珍珠，避開冰塊！</p>
        <div class="controls">
          <button id="left" aria-label="左移">←</button>
          <button id="start">開始遊戲</button>
          <button id="right" aria-label="右移">→</button>
        </div>
      </section>
      <div class="rules">
        <span>
          <i class="pearl"></i> 珍珠 +10 分 </span>
        <span>🧊 冰塊 −1 生命</span>
        <span>⏱ 30 秒挑戰</span>
      </div>
      <p class="hint">使用左右方向鍵、下方按鈕或拖曳杯子。存活到時間結束，並至少接到一顆珍珠，就成功啦！</p>
      <footer>我的第一個vibe coding遊戲</footer>
    </main>
    <script>
      'use strict';
      const $ = id => document.getElementById(id);
      const cv = $('game'),
        ctx = cv.getContext('2d');
      let x = 210,
        items = [],
        score = 0,
        lives = 3,
        active = false,
        start = 0,
        last = 0,
        spawn = 0,
        raf = 0,
        keys = {},
        remain = 30,
        played = false;

      function stats() {
        $('score').textContent = score;
        $('time').textContent = Math.ceil(remain) + ' 秒';
        $('lives').textContent = '♥'.repeat(Math.max(0, lives)) || '0';
        $('lives').setAttribute('aria-label', Math.max(0, lives) + ' 點生命值')
      }

      function draw() {
        ctx.clearRect(0, 0, 420, 265);
        ctx.fillStyle = '#d7b999';
        ctx.fillRect(0, 244, 420, 21);
        ctx.textAlign = 'center';
        ctx.font = '25px sans-serif';
        items.forEach(o => {
          if (o.good) {
            ctx.beginPath();
            ctx.arc(o.x, o.y - 9, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#493025';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(o.x - 3, o.y - 12, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#96735b';
            ctx.fill()
          } else {
            ctx.fillText('🧊', o.x, o.y)
          }
        });
        ctx.font = '38px sans-serif';
        ctx.fillText('🧋', x, 243);
        if (!active && !played) {
          ctx.font = '15px sans-serif';
          ctx.fillStyle = '#654c39';
          ctx.fillText('準備好接住珍珠了嗎？', 210, 110)
        }
      }

      function move(d) {
        x = Math.max(23, Math.min(397, x + d));
      }

      function tick(t) {
        if (!active) return;
        const dt = Math.min((t - last) / 1000, .05);
        last = t;
        remain = Math.max(0, 30 - (t - start) / 1000);
        if (remain <= 0) {
          finish();
          return
        }
        move(((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) * 280 * dt);
        if (t - spawn > 560) {
          items.push({
            x: 24 + Math.random() * 372,
            y: -15,
            good: Math.random() > .3,
            v: 85 + Math.random() * 55 + (30 - remain) * 3
          });
          spawn = t
        }
        items = items.filter(o => {
          o.y += o.v * dt;
          if (lives > 0 && o.y > 213 && o.y < 249 && Math.abs(o.x - x) < 30) {
            if (o.good) score += 10;
            else lives--;
            return false
          }
          return o.y < 285
        });
        stats();
        draw();
        if (lives <= 0) {
          finish();
          return
        }
        raf = requestAnimationFrame(tick)
      }

      function finish() {
        active = false;
        keys = {};
        stats();
        draw();
        $('message').textContent = (lives <= 0 ? '冰塊太多啦！' : score > 0 ? '珍珠手搖飲完成啦！' : '沒有珍珠怎麼可以！') + ' 最終 ' + score + ' 分';
        $('start').textContent = '再玩一次'
      }
      $('start').onclick = () => {
        cancelAnimationFrame(raf);
        x = 210;
        items = [];
        score = 0;
        lives = 3;
        remain = 30;
        keys = {};
        active = true;
        played = true;
        start = last = spawn = performance.now();
        $('message').textContent = '接住珍珠，避開冰塊！';
        $('start').textContent = '重新開始';
        stats();
        draw();
        raf = requestAnimationFrame(tick)
      };
      window.addEventListener('keydown', e => {
        if (active && ['ArrowLeft', 'ArrowRight'].includes(e.key)) {
          e.preventDefault();
          keys[e.key] = true
        }
      });
      window.addEventListener('keyup', e => keys[e.key] = false);
      window.addEventListener('blur', () => keys = {});

      function position(e) {
        if (!active) return;
        x = Math.max(23, Math.min(397, (e.clientX - cv.getBoundingClientRect().left) * 420 / cv.getBoundingClientRect().width));
        draw()
      }
      cv.addEventListener('pointerdown', e => {
        cv.setPointerCapture(e.pointerId);
        position(e)
      });
      cv.addEventListener('pointermove', e => {
        if (cv.hasPointerCapture(e.pointerId)) position(e)
      });
      [
        ['left', 'ArrowLeft', -35],
        ['right', 'ArrowRight', 35]
      ].forEach(([id, key, d]) => {
        const b = $(id);
        b.addEventListener('pointerdown', e => {
          if (!active) return;
          b.setPointerCapture(e.pointerId);
          keys[key] = true;
          move(d);
          draw()
        });
        for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(event, () => keys[key] = false);
        b.addEventListener('click', e => {
          if (active && e.detail === 0) {
            move(d);
            draw()
          }
        })
      });
      stats();
      draw();
    </script>
  </body>
</html>
